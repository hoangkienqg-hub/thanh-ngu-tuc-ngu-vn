<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 Thành Ngữ & Tục Ngữ - Cổng Game Giáo Dục</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  min-height: 100vh;
  background: linear-gradient(160deg, #F0F9FF 0%, #FEF9C3 35%, #FDF2F8 70%, #F0FDF4 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.card {
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(20px);
  border-radius: 32px;
  padding: clamp(2rem, 5vw, 3.5rem);
  text-align: center;
  max-width: 480px;
  width: 100%;
  box-shadow: 0 8px 0 #0284C7, 0 15px 30px rgba(2,132,199,0.15);
  animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes popIn { from{transform:scale(0.8);opacity:0} to{transform:scale(1);opacity:1} }
.icon { font-size: clamp(3rem, 10vw, 5rem); display: block; margin-bottom: 1rem; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
h1 { font-size: clamp(1.2rem, 4vw, 2rem); font-weight: 900; color: #0284C7; margin-bottom: 0.5rem; }
p { font-size: clamp(0.9rem, 2.5vw, 1.1rem); color: #475569; font-weight: 700; margin-bottom: 1.5rem; line-height: 1.6; }
.btn {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: linear-gradient(135deg, #0284C7, #38BDF8);
  color: #fff; font-family: inherit; font-size: clamp(1rem, 3vw, 1.25rem); font-weight: 800;
  padding: 1rem 2.5rem; border: none; border-radius: 16px; cursor: pointer;
  border-bottom: 5px solid #0369A1; transition: all 0.15s;
  box-shadow: 0 8px 0 #0369A1, 0 15px 25px rgba(2,132,199,0.2);
  text-decoration: none;
}
.btn:hover { transform: translateY(-3px); box-shadow: 0 11px 0 #0369A1, 0 20px 30px rgba(2,132,199,0.25); }
.btn:active { transform: translateY(3px); border-bottom-width: 2px; box-shadow: 0 3px 0 #0369A1; }
.badge { display: inline-block; margin-top: 1.5rem; background: #FEF3C7; color: #D97706; font-weight: 800; font-size: 0.8rem; padding: 0.4rem 1rem; border-radius: 999px; border: 2px solid #FCD34D; }
.hint { margin-top: 1rem; font-size: 0.85rem; color: #94A3B8; font-weight: 700; }
</style>
</head>
<body>
<div class="card">
  <span class="icon">🎮</span>
  <h1>Thành Ngữ & Tục Ngữ Dân Gian</h1>
  <p>Tiếng Việt lớp 4-5<br>Kho tàng trí tuệ cha ông 🇻🇳</p>
  <a href="games/29_th_thanh_ngu_tuc_ngu/game_standalone.html" class="btn">🚀 Chơi Ngay!</a>
  <br>
  <span class="badge">✨ Offline 100% — Không cần internet</span>
  <div class="hint">💡 Nếu lỗi "Website can't be reached", hãy dùng file .bat để mở</div>
</div>
</body>
</html>
